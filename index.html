<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="format-detection" content="telephone=no" />

    <!-- App installabile (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ITRS" />
    <!-- black-translucent: la barra di stato è trasparente e il contenuto (la mappa) passa sotto, come nel Figma.
         Limite di iOS: con questa opzione ora e icone sono sempre bianche.
         Un'app già sulla Home tiene la barra vecchia: va tolta e aggiunta di nuovo -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <title>ITRS</title>
    <!-- App dalla Home: fondo dello splash già prima che parta il JavaScript (niente lampo bianco).
         Lo splash aggiunge .booted all'avvio, e da lì vale il fondo normale -->
    <style>
      @media (display-mode: standalone) { html:not(.booted) { background: #01181B; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
